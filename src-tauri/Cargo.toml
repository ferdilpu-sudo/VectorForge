[package]
name = "vectorforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "vectorforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.7.0"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
serde = { version = "=1.0.228", features = ["derive"] }
tauri = { version = "=2.12.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.0"
uuid = { version = "=1.26.1", features = ["v4"] }
visioncortex = "=0.9.3"
vtracer = "=1.0.0-alpha.4"

[dev-dependencies]
serde_json = "=1.0.149"
